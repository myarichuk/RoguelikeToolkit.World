<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebMap spike</title>
<style>
  :root { --bg: #1d1a17; --fg: #e8e0d0; --muted: #a59a88; --accent: #c8a46a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #3a342c; }
  #bar label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  input, select, button { font: inherit; background: #2a2622; color: var(--fg); border: 1px solid #4a4238; border-radius: 4px; padding: 3px 6px; }
  input[type=number] { width: 7ch; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #stats { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  #wrap { position: absolute; inset: 44px 0 0 0; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<div id="bar">
  <label>seed <input id="seed" type="number" value="42"></label>
  <label>planet size <select id="size"><option>4</option><option selected>5</option><option>6</option></select></label>
  <label>field <select id="field"><option value="2048">2048×1024</option><option value="4096" selected>4096×2048</option></select></label>
  <label>warp <input id="warp" type="range" min="0" max="0.08" step="0.005" value="0.03"></label>
  <label>detail <input id="detail" type="range" min="0" max="0.12" step="0.005" value="0.05"></label>
  <button id="go">Generate</button>
  <button id="svg" disabled>Export SVG</button>
  <span id="stats">booting .NET…</span>
</div>
<div id="wrap"><canvas id="map"></canvas></div>
<script type="module" src="main.js"></script>
</body>
</html>
