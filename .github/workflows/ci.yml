name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --filter "Category!=Stress"
    - name: Benchmark smoke
      run: dotnet run --project tests/RoguelikeToolkit.World.Benchmarks -c Release -- --filter "*SmokeBenchmarks*" --launchCount 1 --warmupCount 1 --iterationCount 1
