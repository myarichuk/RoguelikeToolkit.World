name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --filter "Category!=Stress"
    - name: Test (netstandard2.1 / Unity build of Core and Jint)
      run: dotnet test --verbosity normal --filter "Category!=Stress" -p:CoreTargetFramework=netstandard2.1
    - name: Benchmark smoke
      run: dotnet run --project tests/RoguelikeToolkit.World.Benchmarks -c Release -- --filter "*SmokeBenchmarks*" --launchCount 1 --warmupCount 1 --iterationCount 1

  aot-smoke:
    # No JIT, no Reflection.Emit, aggressive trimming: stricter than Unity IL2CPP, so a pass is the CI proxy for
    # "runs under IL2CPP". The native run must print the same world checksum as the JIT run.
    name: NativeAOT smoke (IL2CPP proxy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: JIT run
      run: dotnet run --project tests/RoguelikeToolkit.World.AotSmoke -c Release | tee jit.txt
    - name: Publish NativeAOT
      run: dotnet publish tests/RoguelikeToolkit.World.AotSmoke -c Release -r linux-x64 -o aot-smoke
    - name: Native run + determinism check
      run: |
        ./aot-smoke/RoguelikeToolkit.World.AotSmoke | tee aot.txt
        diff <(grep checksum jit.txt) <(grep checksum aot.txt)
