name: Nightly stress

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  stress:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Stress tests (incl. size-7 scale smoke)
      run: dotnet test --no-build -c Release --verbosity normal --filter "Category=Stress"
