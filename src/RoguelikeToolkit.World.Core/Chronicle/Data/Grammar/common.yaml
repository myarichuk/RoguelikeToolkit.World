  - { id: dd_ass2, when: [cause=assassinated, who], w: 3, t: "In {year} a knife in the dark ended {who}." }
  - { id: dd_han1, when: [cause=hanged, who], w: 3, t: "{who} was hanged in {year}." }
  - { id: dd_rui1, when: [cause=ruined, who], w: 3, t: "{who} lost everything in {year}, and the shame of it was more than {who.he} could bear." }
  - { id: dd_rui2, when: [cause=ruined, who], w: 3, t: "In {year} the creditors came for {who}, and took the house, the ships, and finally the will to live." }
  - { id: dd_g1, when: [who], w: 0.25, t: "{who} died in {year}." }
  - { id: dd_g2, when: [who], w: 0.25, t: "In {year} {realm} mourned {who}." }
  - { id: dd_g3, when: [who, who.reign], t: "In {year} the reign of {who} ended after {who.reign} years." }
  - { id: dd_x1, w: 0.2, t: "In {year} a notable of {realm} died." }

# =====================================================================================================================
# Outlaws, intrigue, privateers
# =====================================================================================================================
event.OutlawRose:
  - { id: or01, when: [outlaw, source=displaced], w: 2, t: "In {year} {outlaw}, burned out of house and home, gathered other homeless folk and took to the roads." }
  - { id: or02, when: [outlaw, source=deserters], w: 2, t: "In {year} {outlaw} walked away from the {other.host} of {other.realm} with a dozen others, and none of them went home." }
  - { id: or03, when: [outlaw, source=ruined], w: 2, t: "{outlaw} lost everything in {year}, and decided the world owed {outlaw.him} the difference." }
  - { id: or04, when: [outlaw, haven], t: "In {year} {outlaw} made a hideout near {haven} and gathered a band of hard men." }
  - { id: or05, when: [outlaw, route.a, route.b], t: "From {year} the road between {route.a} and {route.b} belonged, after dark, to {outlaw}." }
  - { id: or06, when: [outlaw, other.realm], t: "In {year} {outlaw} was declared outlaw by {other.realm}, which only made {outlaw.him} famous." }
  - { id: or07, when: [outlaw], w: 0.25, t: "In {year} {outlaw} raised a band in {noun.wilds}." }
  - { id: or08, when: [outlaw], w: 0.25, t: "The name of {outlaw} was first heard in {year}, whispered by frightened carters." }
  - { id: or09, when: [outlaw, outlaw.epithet], t: "In {year} {outlaw}, soon called {outlaw.epithet}, gathered the desperate and the dispossessed into a band." }
  - { id: or12, when: [outlaw, source=dispossessed], w: 2, t: "In {year} {outlaw} was turned off {outlaw.his} land by a new lord, and took to the woods with a bow and a grievance." }
  - { id: or13, when: [outlaw, source=ruined, route.a], w: 2, t: "The ruined trader {outlaw} came back to the road near {route.a} in {year}, this time with a blade instead of a cart." }
  - { id: or10, when: [outlaw, source=deserters], w: 2, t: "Deserters from the wars rallied to {outlaw} in {year}, bringing their weapons and their grudges." }
  - { id: or11, w: 0.05, t: "In {year} an outlaw band formed in {noun.wilds}." }

event.OutlawEnded:
  - { id: oe01, when: [outlaw, end=hanged], w: 2, t: "In {year} {outlaw} was caught and hanged at a crossroads, as a lesson to others." }
  - { id: oe02, when: [outlaw, end=hanged, other.realm], w: 2, t: "{other.realm|cap} hanged {outlaw} in {year}, and the roads were quieter for a season." }
  - { id: oe03, when: [outlaw, end=pardoned], w: 2, t: "In {year} {outlaw} was pardoned, and took service as a captain; the poachers had become the keepers." }
  - { id: oe04, when: [outlaw, end=pardoned, other.realm], w: 2, t: "{other.realm|cap} bought off {outlaw} with a pardon in {year}." }
  - { id: oe05, when: [outlaw, end=age], w: 2, t: "{outlaw} died old in {year}, in a bed, which is more than any outlaw has a right to expect." }
  - { id: oe06, when: [outlaw, end=slain], w: 2, t: "In {year} {outlaw} was cut down in a fight on the road, and the band scattered." }
  - { id: oe07, when: [outlaw, end=slain, other.realm], w: 2, t: "The riders of {other.realm} cornered {outlaw} in {year} and left nothing to hang." }
  - { id: oe08, when: [outlaw], w: 0.25, t: "The band of {outlaw} came to an end in {year}." }
  - { id: oe11, when: [outlaw, end=hanged, route.a, route.b], w: 2, t: "In {year} {outlaw} swung from a gibbet beside the road from {route.a} to {route.b}, where every carter could see." }
  - { id: oe12, when: [outlaw, end=age, route.a], w: 2, t: "{outlaw}, terror of the road to {route.a}, died of old age in {year}, and the band melted away without {outlaw.him}." }
  - { id: oe09, when: [outlaw], w: 0.25, t: "After {year}, the carters stopped looking over their shoulders for {outlaw}." }
  - { id: oe10, w: 0.05, t: "In {year} an outlaw band came to an end." }

event.Intrigue:
  # sponsorship: a realm pays (or hires) a band to bleed a rival's road; it stays secret until a raid or a confession.
  - { id: in_sp1, when: [plot=sponsorship, other.realm, outlaw], w: 2, t: "In {year} silver from {realm} began to find its way, by roundabout hands, into the purse of {outlaw}, whose band worked the roads of {other.realm}." }
  - { id: in_sp2, when: [plot=sponsorship, other.realm, route.a, route.b], w: 2, t: "In {year} the spymasters of {realm} quietly took the brigands on the road from {route.a} to {route.b} into their pay; {other.realm} would bleed for it, and never know why." }
  - { id: in_sp3, when: [plot=sponsorship, tag=hired, other.realm, outlaw], w: 3, t: "{realm|cap} could not fight {other.realm} openly in {year}, so it hired {outlaw} and a band of cut-throats to do it on the roads." }
  - { id: in_sp4, when: [plot=sponsorship, tag=hired, other.realm, route.a], w: 3, t: "In {year} a stranger with a heavy purse came to the taverns near {route.a}, recruiting hard men for work on the roads of {other.realm}; the purse belonged to {realm}." }
  - { id: in_sp5, when: [plot=sponsorship, spymaster, other.realm], w: 2, t: "In {year} {spymaster}, who kept the secrets of {realm}, began paying brigands to harry the caravans of {other.realm}." }
  # spy_network: an agent planted in the rival's court.
  - { id: in_sn1, when: [plot=spy_network, agent, other.realm], w: 2, t: "In {year} {agent} arrived in {other.realm} as a wool-trader, and was never anything of the kind: {agent.he} answered to {realm}." }
  - { id: in_sn2, when: [plot=spy_network, agent, spymaster, other.realm], w: 3, t: "{spymaster} of {realm} planted {agent} in the court of {other.realm} in {year}, with orders to listen, and to wait." }
  - { id: in_sn3, when: [plot=spy_network, agent, other.realm], w: 2, t: "In {year} a new clerk took service in a great house of {other.realm}. {agent} wrote a fair hand, kept to {agent.him}self, and sent a letter to {realm} every month." }
  - { id: in_sn4, when: [plot=spy_network, other.realm], w: 0.25, t: "In {year} {realm} wove a web of spies through {other.realm}." }
  # sponsorship exposed: by a raid or a hanged man's confession.
  - { id: in_ex1, when: [plot=sponsorship_exposed, tag=raid, other.realm], w: 2, t: "In {year} a raid went wrong, a brigand was taken alive, and {other.realm} learned whose silver had been paying for its burned caravans: that of {realm}." }
  - { id: in_ex2, when: [plot=sponsorship_exposed, tag=confession, outlaw, other.realm], w: 3, t: "On the gallows in {year}, {outlaw} named {outlaw.his} paymaster: {realm}. {other.realm|cap} did not forget it." }
  - { id: in_ex3, when: [plot=sponsorship_exposed, tag=confession, other.realm], w: 2, t: "A hanged man's confession in {year} laid the banditry on the roads of {other.realm} at the door of {realm}." }
  - { id: in_ex4, when: [plot=sponsorship_exposed, other.realm, route.a, route.b], w: 2, t: "In {year} letters bearing the seal of {realm} were found in a saddlebag on the road from {route.a} to {route.b}, and {other.realm} called for war." }
  - { id: in_ex5, when: [plot=sponsorship_exposed, other.realm, outlaw], w: 2, t: "The truth came out in {year}: {outlaw} had been robbing the caravans of {other.realm} on the orders, and the coin, of {realm}." }
  # operations run by an agent (or by a sponsored band on its road): sabotage, bribery, murder, theft.
  - { id: in_sa1, when: [tag!=caught, plot=sabotage, tag=secret, route.a, route.b], w: 2, t: "In {year} a bridge on the road from {route.a} to {route.b} burned in the night; nobody in {other.realm} could say how, and {realm} kept its counsel." }
  - { id: in_sa2, when: [tag!=caught, plot=sabotage, tag=secret, agent, other.realm], w: 2, t: "In {year} {agent} fouled the wells and fired the waystations of {other.realm}, and slipped away before dawn." }
  - { id: in_sa3, when: [tag!=caught, plot=sabotage, outlaw, route.a, route.b], w: 3, t: "In {year} the band of {outlaw} tore up the road between {route.a} and {route.b} at the bidding of {realm}, whose silver it had taken." }
  - { id: in_sa4, when: [tag!=caught, plot=sabotage, other.realm], w: 0.25, t: "In {year} saboteurs of {realm} broke the roads of {other.realm}." }
  - { id: in_br1, when: [tag!=caught, plot=bribe, victim, tag=secret], w: 3, t: "In {year} {victim} of {other.realm} quietly accepted a chest of gold from {realm}, and became a less loyal servant than {victim.he} looked." }
  - { id: in_br2, when: [tag!=caught, plot=bribe, victim, agent], w: 3, t: "{agent} found the price of {victim} in {year}: it was lower than {other.realm} would have liked." }
  - { id: in_br4, when: [tag!=caught, plot=bribe, victim, agent, tag=secret], w: 3, t: "In {year} {agent} sat down to dice with {victim} of {other.realm}, and lost, every night, a little more {realm} gold than any honest player could." }
  - { id: in_br5, when: [tag!=caught, plot=bribe, victim, victim.office], w: 3, t: "The {victim.office} of {other.realm}, {victim}, began in {year} to live far beyond {victim.his} wages; the difference came from {realm}." }
  - { id: in_br6, when: [tag!=caught, plot=bribe, victim], w: 3, t: "In {year} a letter, a ring and a promise from {realm} reached {victim} of {other.realm}; {victim.he} burned the letter and kept the ring, and the promise." }
  - { id: in_br7, when: [tag!=caught, plot=bribe, victim, agent], w: 3, t: "{agent} bought {victim} in {year} the way one buys a horse: slowly, with a careful look at the teeth, and for {realm|poss} money." }
  - { id: in_br8, when: [tag!=caught, plot=bribe, victim, tag=secret], w: 3, t: "By {year} {victim} of {other.realm} was taking the gold of {realm}, and would take its orders when the war came." }
  - { id: in_br9, when: [tag!=caught, plot=bribe, agent, other.realm], w: 2, t: "In {year} {agent} spread the silver of {realm} among the captains of {other.realm}, where it would do the most harm." }
  - { id: in_br3, when: [tag!=caught, plot=bribe, other.realm], w: 0.25, t: "In {year} the gold of {realm} bought a friend in the war councils of {other.realm}." }
  - { id: in_as1, when: [tag!=caught, plot=assassination, tag=killed, victim, tag=secret], w: 3, t: "In {year} {victim} of {other.realm} was found dead in {victim.his} chamber, without a mark; the hand that did it belonged to {realm}, and nobody ever proved it." }
  - { id: in_as2, when: [tag!=caught, plot=assassination, tag=killed, victim, agent], w: 3, t: "In {year} {agent}, an agent of {realm}, put a knife into {victim} of {other.realm} and walked away through the crowd." }
  - { id: in_as3, when: [tag!=caught, plot=assassination, tag=failed, victim], w: 3, t: "In {year} an assassin came for {victim} of {other.realm} and missed by a hand's breadth." }
  - { id: in_as4, when: [tag!=caught, plot=assassination, tag=failed, victim, agent], w: 3, t: "{agent} tried to poison {victim} in {year}, but the wrong cup was drunk, and {other.realm} lost only a taster." }
  - { id: in_th1, when: [tag!=caught, plot=theft, victim, agent], w: 3, t: "In {year} {agent} emptied the strongroom of {victim}, the richest merchant of {other.realm}, and the gold went home to {realm}." }
  - { id: in_th2, when: [tag!=caught, plot=theft, victim], w: 3, t: "In {year} the ledgers of {victim} came up short by a fortune, and the merchants of {other.realm} began to mistrust each other." }
  - { id: in_th3, when: [tag!=caught, plot=theft, other.realm], w: 0.25, t: "In {year} agents of {realm} robbed the counting-houses of {other.realm}." }
  # caught: the agent is taken and executed, and the sponsor named.
  - { id: in_ca1, when: [tag=caught, agent, other.realm], w: 5, t: "In {year} {other.realm} caught {agent} at {agent.his} work, and hanged {agent.him} in the market square with a placard naming the paymaster: {realm}." }
  - { id: in_ca2, when: [tag=caught, agent, other.realm, plot=assassination], w: 6, t: "The assassin {agent} was taken in {year} with blood still on {agent.his} hands; under the irons {agent.he} named {realm}, and was executed before the day was out." }
  - { id: in_ca3, when: [tag=caught, agent, other.realm, plot=discovered], w: 6, t: "In {year} the watch of {other.realm} uncovered {agent}, who had sat quietly in the court for years writing letters to {realm}; the letters stopped, and so did {agent}." }
  - { id: in_ca4, when: [tag=caught, other.realm, plot=sabotage], w: 6, t: "In {year} a saboteur was caught at the bridges of {other.realm}; before the axe fell, the name {realm} was heard by everyone in the square." }
  - { id: in_ca5, when: [tag=caught, agent, other.realm, plot=bribe], w: 6, t: "In {year} {agent} was caught passing gold to the officers of {other.realm}; {agent.he} was executed, and the gold, and the grudge, were sent back to {realm}." }
  - { id: in_ca6, when: [tag=caught, other.realm], w: 3, t: "In {year} {other.realm} executed a spy of {realm}, and the envoys of the two realms stopped speaking." }
  - { id: in_ca7, when: [tag=caught, agent, other.realm, plot=theft], w: 6, t: "In {year} {agent} was taken with a merchant's gold in {agent.his} pack, and confessed on the rack that {realm} had sent {agent.him}." }
  # fallbacks
  - { id: in_g1, when: [tag=exposed, other.realm], w: 0.25, t: "In {year} {other.realm} uncovered a plot of {realm}." }
  - { id: in_g2, when: [other.realm], w: 0.25, t: "Spies of {realm} were busy in {other.realm} all through {year}." }
  - { id: in_g3, when: [other.realm], w: 0.25, t: "In {year} the court of {other.realm} was full of rumours, most of them started by {realm}." }
  - { id: in_x1, w: 0.05, t: "In {year} there was intrigue in {realm}." }

event.Privateering:
  - { id: pv_c1, when: [tag=commission, privateer, other.realm], w: 3, t: "In {year} {realm} gave {privateer} a letter of marque against the shipping of {other.realm}: piracy, with a seal on it." }
  - { id: pv_c2, when: [tag=commission, privateer], w: 3, t: "In {year} {privateer} was given a ship, a crew of hard cases and a royal licence to take what {privateer.he} could." }
  - { id: pv_c3, when: [tag=commission, privateer, other.realm], w: 3, t: "{privateer} swore in {year} to serve {realm} at sea, against {other.realm} and anyone else who flew {other.realm|poss} colours." }
  - { id: pv_p1, when: [tag=prize, privateer, other.realm], w: 3, t: "In {year} the privateer {privateer} took a merchantman of {other.realm} and brought its cargo home to {realm}." }
  - { id: pv_p2, when: [tag=prize, privateer, merchant, other.realm], w: 4, t: "In {year} {privateer} ran down a ship of {merchant}, the great merchant of {other.realm}, and sold {merchant.his} cargo on the quays of {realm}." }
  - { id: pv_p3, when: [tag=prize, privateer, other.realm], w: 3, t: "{privateer} burned three ships of {other.realm} off the coast in {year} and sold the fourth." }
  - { id: pv_p4, when: [tag=prize, privateer, sponsor], w: 2, t: "{privateer} sailed under licence from {sponsor} in {year}, which made it legal, if not honest, and came home with a prize." }
  - { id: pv_p5, when: [tag=prize, privateer, other.realm], w: 3, t: "The merchants of {other.realm} cursed the name of {privateer} in {year}, and insured their cargoes twice." }
  - { id: pv05, when: [privateer], w: 0.25, t: "In {year} the sea-raider {privateer} made a name and a fortune." }
  - { id: pv07, when: [other.realm], w: 0.25, t: "In {year} licensed raiders preyed on the ships of {other.realm}." }
  - { id: pv08, w: 0.05, t: "In {year} privateers prowled the coasts." }
