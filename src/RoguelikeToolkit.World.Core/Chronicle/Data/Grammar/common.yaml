  - { id: gr_x5, when: [other.realm], t: "Bad blood between {realm} and {other.realm} grew worse in {year}." }
  - { id: gr_x6, when: [other.realm], t: "The {adj} heralds named {other.realm} an enemy of {realm} in {year}." }
  - { id: gr_x7, w: 0.05, t: "In {year} {realm} nursed a grudge." }

