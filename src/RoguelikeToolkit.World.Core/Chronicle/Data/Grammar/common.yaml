# Chronicle grammar: symbol -> rules { id, when: [predicates], w: weight, cd: cooldown, t: "template" }.
# Every event renders from event.<Kind> (event.generic as a fallback). Slots: {realm}, {att.general}, {terrain.noun}...;
# modifiers |cap |lower |pl |a |poss |ord |num |the; nested symbols {#symbol}, optional {#symbol?}. Predicates: key=value,
# key=a|b, key!=value, key (present), "!key" (absent). A rule is drawn only when every slot it names resolves.
# Culture overlays (Grammar/<culture>.yaml) add rules; a rule with an existing id replaces it; "symbol!" replaces the pool.

# =====================================================================================================================
# Fallback
# =====================================================================================================================
event.generic:
  - { id: g01, when: [realm], t: "In {year}, {realm} knew {what}." }
  - { id: g02, when: [realm], t: "The annals of {realm} for {year} record {what}." }
  - { id: g03, when: [realm], t: "{year}: {what|cap} came to {realm}." }
  - { id: g04, t: "In {year} the chroniclers set down {what}." }
  - { id: g05, t: "Of {year}, the records speak of {what}." }
  - { id: g06, t: "{year} brought {what}." }

# =====================================================================================================================
# Field battles (War, with a battle record)
# =====================================================================================================================
event.War:
  - { id: wb_full, when: [battle], w: 4, cd: 0, t: "{#battle.intro} {#battle.engage} {#battle.turn?} {#battle.fate?} {#battle.rout} {#battle.after?} {#battle.cry?}" }
  - { id: wb_short, when: [battle], w: 2, cd: 0, t: "{#battle.intro} {#battle.turn} {#battle.fate?} {#battle.rout} {#battle.cry?}" }
  - { id: wb_plain, when: [battle], w: 1, cd: 0, t: "{#battle.intro} {#battle.engage} {#battle.fate?} {#battle.rout} {#battle.after?}" }
  - { id: wl01, when: ["!battle", att.realm, def.realm], t: "In {year} {att.realm} raided the borders of {def.realm}, burning what it could not carry off." }
  - { id: wl02, when: ["!battle", att.realm, def.realm], t: "War came in {year}: {att.realm} fell upon {def.realm}." }
  - { id: wl03, when: ["!battle", att.realm, def.realm], t: "The {att.adj} {att.host} of {att.realm} crossed into {def.realm} in {year} with fire and spear." }
  - { id: wl04, when: ["!battle", att.realm, def.realm], t: "{year} saw {att.realm} and {def.realm} at each other's throats once more." }
  - { id: wl05, when: ["!battle", att.realm, def.realm], t: "Border fighting flared in {year}, when {att.realm} struck at {def.realm}." }
  - { id: wl06, when: ["!battle", att.realm, def.realm], t: "In {year} the {def.people} of {def.realm} woke to find the {att.adj} {att.host} among their fields." }
  - { id: wl07, when: ["!battle"], w: 0.25, t: "In {year} there was war on the border." }

battle.intro:
  - { id: bi01, when: [season=winter, att.general], w: 2, t: "In {year}, in {season.word}, {att.general} led the {att.host} of {att.realm} against {def.realm}." }
  - { id: bi02, when: [kind=Ambush], w: 2, t: "In {year} {def.realm|poss} {def.host} marched blind into the {terrain.noun}, and never saw the trap close around it." }
  - { id: bi03, t: "In {year} {att.realm} marched on {def.realm}, and the two hosts met on the {terrain.noun}." }
  - { id: bi04, when: [att.general, att.general.epithet], t: "{att.general} {att.general.epithet} called the banners of {att.realm} in {year} and went looking for the {def.host} of {def.realm}." }
  - { id: bi05, when: [season=spring], w: 2, t: "With {season.word} of {year} the {att.adj} {att.host} came down upon {def.realm}." }
  - { id: bi06, when: [season=summer], w: 2, t: "In {season.word} of {year} the {att.people} of {att.realm} crossed into the lands of {def.realm}." }
  - { id: bi07, when: [season=autumn], w: 2, t: "When the harvest of {year} was in, {att.realm} turned its spears on {def.realm}." }
  - { id: bi08, when: [att.general, def.general], w: 2, t: "In {year} {att.general} of {att.realm} and {def.general} of {def.realm} met at last on the {terrain.noun}." }
  - { id: bi09, t: "{def.realm|cap} had word of the coming storm in {year}, and drew up its {def.host} to meet {att.realm} on the {terrain.noun}." }
  - { id: bi10, when: [terrain=forest], w: 2, t: "The war of {year} came to the {terrain.noun}, where {att.realm} sought out {def.realm} beneath the trees." }
  - { id: bi11, when: [terrain=hills|mountain], w: 2, t: "In {year} {att.realm} pushed up into the {terrain.noun} to bring {def.realm} to battle." }
  - { id: bi12, when: [terrain=marsh], w: 2, t: "{year} found the {att.host} of {att.realm} wading through the {terrain.noun} after {def.realm}." }
  - { id: bi13, when: [terrain=desert], w: 2, t: "Under the white sun of {year}, {att.realm} crossed the {terrain.noun} toward {def.realm}." }
  - { id: bi14, when: [terrain=snow], w: 2, t: "In {year} the {att.adj} {att.host} trudged across the {terrain.noun} to strike at {def.realm}." }
  - { id: bi15, when: [kind=Relief, parent.settlement], w: 6, t: "In {year} {att.realm} marched to break the siege of {parent.settlement}, and {def.realm} turned from its siege lines to meet it." }
  - { id: bi16, when: [kind=Relief, parent.settlement, att.general], w: 6, t: "{att.general} brought the {att.host} of {att.realm} to the relief of {parent.settlement} in {year}, and the besiegers came out to fight." }
  - { id: bi17, when: [tag=winter_quarters], w: 4, t: "The {att.host} of {att.realm} wintered hard in its quarters and took the field against {def.realm} only with the spring of {year}." }
  - { id: bi18, when: [place], t: "The fighting of {year} came to the very walls of {place}, where {att.realm} met {def.realm}." }
  - { id: bi19, when: [kind=Naval], w: 6, t: "In {year} the ships of {att.realm} and {def.realm} met on the grey sea." }
  - { id: bi20, when: [att.general.age], t: "In {year} {att.general}, then {att.general.age} years of age, took the {att.host} of {att.realm} to war against {def.realm}." }
  - { id: bi21, when: [season=winter], w: 2, t: "{att.realm|cap} went to war in {season.word} of {year}, when no sane captain marches, and caught {def.realm} by surprise." }
  - { id: bi22, when: [kind=Ambush, def.general], w: 2, t: "{def.general} led the {def.host} of {def.realm} through the {terrain.noun} in {year}, never guessing that {att.realm} was waiting." }
  - { id: bi23, t: "{year} was a year of war: {att.realm} gathered its {att.host} and went against {def.realm}." }
  - { id: bi24, when: [tag=winter_quarters, att.general], w: 4, t: "{att.general} kept the {att.host} of {att.realm} in winter quarters through the cold, and in the spring of {year} fell on {def.realm}." }

battle.engage:
  - { id: en01, when: [att.tactic, def.tactic], w: 2, t: "{att.realm|cap} staked the day on {att.tactic}; {def.realm} answered with {def.tactic}." }
  - { id: en02, when: [att.unit, def.unit], w: 2, t: "The {att.unit} of {att.realm} came on against the {def.unit} of {def.realm}." }
  - { id: en03, t: "For an hour the two hosts only shouted across the {terrain.noun}, until the first ranks crashed together." }
  - { id: en04, t: "The {att.adj} and the {def.adj} lines met with a crash heard for miles." }
  - { id: en05, when: [att.general, def.general], t: "{att.general} and {def.general} each held back their best until the other should blink." }
  - { id: en06, when: [att.tactic, def.unit], t: "Against the {def.unit} of {def.realm}, {att.realm} tried {att.tactic}." }
  # attacker tactics
  - { id: ea_ambush, when: [att.tactic=ambush], w: 3, t: "{att.realm|cap} would not fight in the open: its {att.unit} lay hidden in the {terrain.noun} and waited." }
  - { id: ea_berserk, when: [att.tactic=berserk_rush], w: 3, t: "The {att.unit} of {att.realm} worked themselves into a frenzy and hurled themselves forward without order or mercy." }
  - { id: ea_charge, when: [att.tactic=heavy_charge], w: 3, t: "{att.realm|cap} massed its {att.unit} for one great charge, lances lowered and banners streaming." }
  - { id: ea_horsebow, when: [att.tactic=horse_archers], w: 3, t: "The {att.unit} of {att.realm} rode rings around the enemy, loosing as they wheeled." }
  - { id: ea_arrows, when: [att.tactic=massed_archery], w: 3, t: "{att.realm|cap} opened the day with its {att.unit}, and {noun.sky} went dark with shafts." }
  - { id: ea_pike, when: [att.tactic=pike_square], w: 3, t: "{att.realm|cap} advanced in deep squares of pikes, a moving hedge of iron." }
  - { id: ea_shield, when: [att.tactic=shieldwall], w: 3, t: "The {att.adj} line locked shields and walked forward, step by heavy step." }
  - { id: ea_engines, when: [att.tactic=siege_engines], w: 3, t: "{att.realm|cap} dragged its engines into range and let the stones speak first." }
  - { id: ea_skirmish, when: [att.tactic=skirmish], w: 3, t: "{att.realm|cap} sent its {att.unit} forward in a loose screen, to sting and fall back and sting again." }
  - { id: ea_beasts, when: [att.tactic=war_beasts], w: 3, t: "{att.realm|cap} drove its {att.unit} before the line, and the ground shook under them." }
  # defender tactics
  - { id: ed_ambush, when: [def.tactic=ambush], w: 3, t: "{def.realm|cap} had hidden its {def.unit} in the {terrain.noun}, and they rose from cover as the enemy passed." }
  - { id: ed_berserk, when: [def.tactic=berserk_rush], w: 3, t: "{def.realm|cap} did not wait to be attacked: its {def.unit} came screaming down to meet the enemy." }
  - { id: ed_charge, when: [def.tactic=heavy_charge], w: 3, t: "{def.realm|cap} answered with its {def.unit}, thundering across the {terrain.noun} knee to knee." }
  - { id: ed_horsebow, when: [def.tactic=horse_archers], w: 3, t: "The {def.unit} of {def.realm} would not close, but rode and loosed and rode again." }
  - { id: ed_arrows, when: [def.tactic=massed_archery], w: 3, t: "The {def.unit} of {def.realm} met the advance with arrow after arrow." }
  - { id: ed_pike, when: [def.tactic=pike_square], w: 3, t: "{def.realm|cap} grounded its pikes and waited, and the {def.unit} did not flinch." }
  - { id: ed_shield, when: [def.tactic=shieldwall], w: 3, t: "{def.realm|cap} stood behind a wall of shields and dared the enemy to break it." }
  - { id: ed_engines, when: [def.tactic=siege_engines], w: 3, t: "{def.realm|cap} had dragged engines up behind its lines, and they threw stones into the advancing ranks." }
  - { id: ed_skirmish, when: [def.tactic=skirmish], w: 3, t: "The {def.unit} of {def.realm} harried the enemy's every step from the {terrain.noun}." }
  - { id: ed_beasts, when: [def.tactic=war_beasts], w: 3, t: "{def.realm|cap} loosed its {def.unit}, roaring, into the enemy's path." }

battle.turn:
  - { id: bt_flank1, when: [beat=flank, win.unit], w: 3, t: "Then the {win.unit} of {win.realm} swept round the flank, and the {lose.adj} line folded like wet parchment." }
  - { id: bt_flank2, when: [beat=flank], w: 3, t: "The day turned when {win.realm} found an open flank and rode into it." }
  - { id: bt_flank3, when: [beat=flank, win.general], w: 2, t: "{win.general} saw the gap on the enemy's left before anyone else did, and sent the horse through it." }
  - { id: bt_line1, when: [beat=broke_the_line], w: 3, t: "At the third push the {lose.adj} line cracked, and then it shattered." }
  - { id: bt_line2, when: [beat=broke_the_line, win.unit], w: 3, t: "The {win.unit} of {win.realm} drove a wedge through the centre, and the enemy {verb.broke}." }
  - { id: bt_feint1, when: [beat=feigned_retreat], w: 3, t: "{win.realm|cap} feigned a rout; {lose.realm} chased, broke its own order, and was cut apart." }
  - { id: bt_feint2, when: [beat=feigned_retreat, win.general], w: 3, t: "{win.general} ordered a retreat that was no retreat, and the enemy fell for it." }
  - { id: bt_arrow1, when: [beat=arrow_storm], w: 3, t: "Arrows fell like {season.word} hail, and the {lose.adj} ranks thinned under them." }
  - { id: bt_arrow2, when: [beat=arrow_storm, win.realm], w: 3, t: "The archers of {win.realm} emptied quiver after quiver until the enemy could stand no more." }
  - { id: bt_shields1, when: [beat=shields_locked], w: 3, t: "Shield ground against shield for the length of the afternoon, and it was {win.realm} that pushed last." }
  - { id: bt_shields2, when: [beat=shields_locked], w: 3, t: "The two walls of shields locked and heaved, and men drowned in the press without a blow struck." }
  - { id: bt_pikes1, when: [beat=pikes_held], w: 3, t: "The pikes held. Horse after horse was spitted on them, and the charge broke like surf on rock." }
  - { id: bt_pikes2, when: [beat=pikes_held, win.realm], w: 3, t: "Three times the enemy came at the pikes of {win.realm}, and three times it fell back." }
  - { id: bt_harried1, when: [beat=harried], w: 3, t: "{win.realm|cap} harried the enemy from every side until its order dissolved into a mob." }
  - { id: bt_harried2, when: [beat=harried], w: 3, t: "Stung from the flanks and the rear, the {lose.adj} host could neither fight nor flee in good order." }
  - { id: bt_trap1, when: [beat=trap_sprung], w: 3, t: "The trap was sprung: the {terrain.noun} itself seemed to rise up with blades." }
  - { id: bt_trap2, when: [beat=trap_sprung, lose.general], w: 3, t: "{lose.general} had led the {lose.host} straight into the jaws of the trap." }
  - { id: bt_night1, when: [beat=night_attack], w: 3, t: "{win.realm|cap} came in the dark, and the {lose.adj} camp woke to fire and screaming." }
  - { id: bt_night2, when: [beat=night_attack], w: 3, t: "It was a night attack; nobody on the field could tell friend from foe until dawn showed who had won." }
  - { id: bt_frenzy1, when: [beat=frenzy], w: 3, t: "A frenzy took the {win.adj} ranks, and they fought like things possessed." }
  - { id: bt_frenzy2, when: [beat=frenzy], w: 3, t: "The {win.host} of {win.realm} went mad with battle-rage, and no shield could stop them." }
  - { id: bt_stampede1, when: [beat=stampede], w: 3, t: "The beasts stampeded, trampling friend and foe alike, and {lose.realm} got the worst of it." }
  - { id: bt_stampede2, when: [beat=stampede], w: 3, t: "Maddened beasts tore through the {lose.adj} lines, and the {lose.host} never recovered." }
  - { id: bt_rain1, when: [beat=rain_on_bowstrings], w: 3, t: "Spring rain soaked the bowstrings of {lose.realm}, and its archers stood useless." }
  - { id: bt_rain2, when: [beat=rain_on_bowstrings], w: 3, t: "It rained, and wet strings and sodden fletching cost {lose.realm} the day." }
  - { id: bt_ford1, when: [beat=river_ford_held], w: 3, t: "{win.realm|cap} held the ford. The river ran red with the {lose.people} who tried to cross it." }
  - { id: bt_ford2, when: [beat=river_ford_held], w: 3, t: "All day {lose.realm} tried the river crossing, and all day the {win.adj} spears threw them back into the water." }
  - { id: bt_ford3, when: [beat=river_ford_held, win.general], w: 2, t: "{win.general} planted the banner of {win.realm} at the ford and swore not to give a yard, and did not." }
  - { id: bt_upstream1, when: [beat=forded_upstream], w: 3, t: "{win.realm|cap} found a ford upstream and was across before the enemy knew it." }
  - { id: bt_upstream2, when: [beat=forded_upstream], w: 3, t: "A shepherd showed {win.realm} a crossing upstream, and the river that should have saved {lose.realm} was turned." }
  - { id: bt_snow1, when: [beat=snowbound], w: 3, t: "The snow came down so thick that men froze where they stood, and the {lose.adj} host froze fastest." }
  - { id: bt_snow2, when: [beat=snowbound], w: 3, t: "Snowbound and starving, the {lose.host} of {lose.realm} fought on half-frozen feet." }
  - { id: bt_mired1, when: [beat=mired], w: 3, t: "The {lose.adj} riders charged into the mire and sank to their horses' bellies." }
  - { id: bt_mired2, when: [beat=mired], w: 3, t: "The soft ground swallowed the enemy's horse, and with it the enemy's hopes." }
  - { id: bt_duel1, when: [beat=champion_duel], w: 3, t: "Before the lines met, the champions of both hosts fought alone between them, and the champion of {win.realm} lived." }
  - { id: bt_duel2, when: [beat=champion_duel, win.general], w: 3, t: "{win.general} answered the enemy's challenge in person, and won the duel and the day with one stroke." }
  - { id: bt_held1, when: [beat=held_the_line], w: 3, t: "The line held, and held, and held, and at the end of it neither side had moved." }
  - { id: bt_held2, when: [beat=held_the_line], w: 3, t: "{def.realm|cap} would not break and {att.realm} would not stop, and the dead piled up between them." }
  - { id: bt_last1, when: [beat=last_stand], w: 3, t: "The last of the {lose.adj} host made a stand on a little rise, and sold their lives dearly." }
  - { id: bt_last2, when: [beat=last_stand, lose.unit], w: 3, t: "The {lose.unit} of {lose.realm} formed a ring around their standard and died there, every one." }
  - { id: bt_slaughter1, when: [beat=slaughter], w: 3, t: "{win.realm|cap} gave no quarter, and the field became a slaughter-yard." }
  - { id: bt_slaughter2, when: [beat=slaughter], w: 3, t: "What followed was not a battle but a butchery: {win.realm} killed every {lose.adj} soldier it could reach." }
  - { id: bt_hard1, when: [beat=hard_fought], w: 2, t: "It was a hard day, decided by inches." }
  - { id: bt_hard2, when: [beat=hard_fought], w: 2, t: "The fighting swayed back and forth until both sides could barely lift their arms." }
  - { id: bt_hard3, when: [beat=hard_fought], w: 2, t: "Nobody who fought on the {terrain.noun} that day called it an easy victory." }
  - { id: bt_rout1, when: [beat=rout], w: 2, t: "When the enemy {verb.broke}, it {verb.broke} all at once." }
  - { id: bt_rout2, when: [beat=rout], w: 2, t: "The rout began at the back of the {lose.adj} host, where men could not see the fighting but could hear it." }
  - { id: bt_refused1, when: [beat=field_refused], w: 3, t: "{def.realm|cap} would not give battle, and shut itself behind its walls while {att.realm} burned the fields." }
  - { id: bt_refused2, when: [beat=field_refused], w: 3, t: "Outnumbered, {def.realm} let the raiders pass and counted the smoke from behind its walls." }
  - { id: bt_withdrew1, when: [beat=withdrew], w: 3, t: "Seeing the odds, {att.realm} turned back without a blow." }

battle.fate:
  - { id: bf_fell1, when: [beat=general_fell, fallen], w: 3, t: "{fallen} fell in the press, and the {adj.grim} news ran down the lines of {fallen.realm}." }
  - { id: bf_fell2, when: [beat=general_fell, fallen], w: 3, t: "{fallen} was cut down at the height of the fighting; {fallen.his} body was carried from the field on a broken shield." }
  - { id: bf_fell3, when: [beat=general_fell, fallen, fallen.age], w: 2, t: "{fallen} died on the field at {fallen.age}, sword in hand." }
  - { id: bf_fell4, when: [beat=general_fell, fallen], w: 2, t: "An arrow found {fallen} at the turning of the day, and {fallen.realm} lost its captain." }
  - { id: bf_fell5, when: [beat=general_fell, "!fallen"], w: 2, t: "A captain fell that day, and was mourned." }
  - { id: bf_capt1, when: [beat=general_captured, lose.general], w: 3, t: "{lose.general} was taken alive and led away to await a ransom." }
  - { id: bf_capt2, when: [beat=general_captured, lose.general], w: 3, t: "{lose.general} surrendered {lose.general.his} sword and was held for ransom by {win.realm}." }
  - { id: bf_capt3, when: [beat=general_captured], w: 2, t: "The enemy captain was taken alive, a prize worth more than any plunder." }
  - { id: bf_turn1, when: [beat=turncoat, lose.general], w: 4, t: "At the height of the fighting {lose.general} turned {lose.general.his} banner and went over to the enemy, bought long before." }
  - { id: bf_turn2, when: [beat=turncoat], w: 4, t: "Then a captain of {lose.realm} betrayed the host, wheeling his company out of the line at the worst possible moment; somebody had paid him well." }
  - { id: bf_turn3, when: [beat=turncoat], w: 3, t: "Treachery decided the day: a bribed commander of {lose.realm} opened the line to the enemy." }
  - { id: bf_heads1, when: [beat=heads_taken], w: 3, t: "{win.realm|cap} took the heads of the slain, as was its custom, and stacked them by the road." }
  - { id: bf_heads2, when: [beat=heads_taken], w: 3, t: "That night the victors took heads, and the {lose.people} never forgot it." }

battle.rout:
  - { id: br_ad1, when: [winner=attacker, margin=decisive], t: "{def.realm|poss} {def.host} {verb.broke} and ran, and the {att.adj} riders cut it down until dark." }
  - { id: br_ad2, when: [winner=attacker, margin=decisive], t: "By nightfall {def.realm} had no army left, only {noun.dead}." }
  - { id: br_ad3, when: [winner=attacker, margin=decisive], t: "{att.realm|cap} {verb.won}; {def.realm} fled the {terrain.noun} with {def.loss}." }
  - { id: br_ad4, when: [winner=attacker, margin=decisive, def.general], t: "{def.general} rode from the field with a handful of guards; the rest of {def.realm|poss} {def.host} lay where it fell." }
  - { id: br_av1, when: [winner=attacker, margin=victory], t: "By dusk {att.realm} held the field, and {def.realm} drew off with {def.loss}." }
  - { id: br_av2, when: [winner=attacker, margin=victory], t: "{att.realm|cap} {verb.won}, though {def.realm} withdrew in good order." }
  - { id: br_av3, when: [winner=attacker, margin=victory], t: "The {def.adj} {def.host} gave ground at last and fell back, leaving the field to {att.realm}." }
  - { id: br_av4, when: [winner=attacker, margin=victory, att.general], t: "{att.general} camped on the field that night, and counted it a victory." }
  - { id: br_ap1, when: [margin=pyrrhic], t: "{att.realm|cap} held the field, but limped from it with {att.loss}." }
  - { id: br_ap2, when: [margin=pyrrhic], t: "It was a victory for {att.realm}, of the kind that ruins the victor." }
  - { id: br_ap3, when: [margin=pyrrhic], t: "{att.realm|cap} won the day and lost the flower of its {att.host} doing it." }
  - { id: br_st1, when: [margin=stalemate], t: "Neither side would yield; at nightfall the hosts drew apart, and {att.realm} and {def.realm} both claimed the day." }
  - { id: br_st2, when: [margin=stalemate], t: "The battle ended where it began, with nothing won but graves." }
  - { id: br_st3, when: [margin=stalemate], t: "When the light failed the two hosts were still facing each other across their own dead." }
  - { id: br_dv1, when: [winner=defender, margin=victory], t: "{def.realm|cap} held, and the {att.adj} {att.host} fell back with {att.loss}." }
  - { id: br_dv2, when: [winner=defender, margin=victory], t: "The attack failed; {att.realm} withdrew, and {def.realm} let it go." }
  - { id: br_dv3, when: [winner=defender, margin=victory, def.general], t: "{def.general} {verb.won}, and {att.realm} went home with nothing to show for the march." }
  - { id: br_dv4, when: [winner=defender, margin=victory], t: "{def.realm|cap} {verb.won}, and the invaders turned for home." }
  - { id: br_dd1, when: [winner=defender, margin=decisive], t: "The {att.host} of {att.realm} was routed, and {def.realm} hunted its remnants for three days." }
  - { id: br_dd2, when: [winner=defender, margin=decisive], t: "{att.realm|cap} {verb.broke}, and its {att.host} {verb.fled} across the {terrain.noun}, throwing down shields as it went." }
  - { id: br_dd3, when: [winner=defender, margin=decisive], t: "Of the {att.adj} {att.host} that marched out, barely a remnant came home, with {att.loss}." }
  - { id: br_dd4, when: [winner=defender, margin=decisive, att.general], t: "{att.general} escaped the rout by a hair; few of {att.general.his} soldiers were so lucky." }
  - { id: br_x1, when: [win.realm, lose.realm], w: 0.5, t: "The day went to {win.realm}." }

battle.after:
  - { id: ba_ad1, when: [winner=attacker, margin=decisive], t: "The road to the heart of {def.realm} lay open." }
  - { id: ba_ad2, when: [winner=attacker, margin=decisive], t: "{def.realm|cap} sued for whatever terms it could get." }
  - { id: ba_av1, when: [winner=attacker, margin=victory], t: "The {att.adj} host spent the rest of the season looting the countryside of {def.realm}." }
  - { id: ba_av2, when: [winner=attacker, margin=victory], t: "Smoke rose over the farms of {def.realm} for weeks after." }
  - { id: ba_ap1, when: [margin=pyrrhic], t: "{noun.song|cap} were made of it in {att.realm}, but they were sung by widows." }
  - { id: ba_ap2, when: [margin=pyrrhic], t: "{att.realm|cap} had won the battle and could not afford another." }
  - { id: ba_st1, when: [margin=stalemate], t: "Both realms buried their dead and sharpened their grudges." }
  - { id: ba_st2, when: [margin=stalemate], t: "Nothing was settled, and everyone knew it." }
  - { id: ba_dv1, when: [winner=defender], t: "{def.realm|cap} remembered the day, and the grudge." }
  - { id: ba_dv2, when: [winner=defender, margin=decisive], t: "The bones of {att.realm|poss} host whitened on the {terrain.noun} for a generation." }
  - { id: ba_dv3, when: [winner=defender, margin=decisive], t: "In {def.realm} they still point out the place where the invaders broke." }
  - { id: ba_x1, when: [win.realm, lose.realm], t: "{year} was remembered in {win.realm} as a year of triumph, and in {lose.realm} as a year of {noun.grief}." }
  - { id: ba_x2, when: [win.realm], t: "{time.later|cap}, the {win.people} drank to that day." }
  - { id: ba_m1, when: [tag=mercenaries], w: 3, t: "The merchants of {att.realm} had paid for sell-swords to swell the {att.host}, and expected their money's worth." }
  - { id: ba_m2, when: [tag=mercenaries, winner=defender], w: 3, t: "The hired companies of {att.realm} were the first to leave the field, as hired companies are." }
  - { id: ba_m3, when: [tag=mercenaries, winner=attacker], w: 3, t: "The merchants' gold had bought {att.realm} its victory, and the merchants did not let anyone forget it." }
  - { id: ba_q1, when: [tag=winter_quarters], w: 0.5, t: "Few in the {att.host} who had wintered in quarters ever spoke well of that campaign." }

battle.cry:
  - { id: cry0, w: 3, cd: 0, t: "" }
  - { id: cry1, when: [win.cry], t: "Long after, the {win.people} still told how the {win.host} had roared \"{win.cry}\"" }
  - { id: cry2, when: [win.cry], t: "The cry of the victors carried across the field: \"{win.cry}\"" }
  - { id: cry3, when: [lose.cry], t: "The last the field heard of the {lose.adj} host was its old cry, \"{lose.cry}\"" }
  - { id: cry4, when: [win.cry, win.general], t: "{win.general} raised {win.general.his} blade and the whole host answered: \"{win.cry}\"" }

# =====================================================================================================================
# Campaigns that never came to battle
# =====================================================================================================================
event.Campaign:
  - { id: ca_dec1, when: [tag=declined, winner=none], t: "In {year} {att.realm} marched against {def.realm}, but found its host outmatched and turned back without a blow." }
  - { id: ca_dec2, when: [tag=declined], t: "{att.realm|cap} went to war with {def.realm} in {year}, looked at the odds across the {terrain.noun}, and thought better of it." }
  - { id: ca_dec3, when: [tag=declined, att.general], t: "{att.general} led {att.realm} out in {year}, took one look at the {def.adj} lines, and ordered the march home." }
  - { id: ca_dec4, when: [tag=declined], t: "The campaign of {year} ended before it began: {att.realm} would not risk its {att.host} against {def.realm}." }
  - { id: ca_sup1, when: [tag=supply_failed], t: "In {year} {att.realm} marched on {def.realm}, but the wagons never caught up, and hunger did what no enemy had to." }
  - { id: ca_sup2, when: [tag=supply_failed], t: "The campaign of {year} against {def.realm} died on the road: {att.realm|poss} {att.host} ate its horses and went home." }
  - { id: ca_sup3, when: [tag=supply_failed, season=winter], t: "{att.realm|cap} marched on {def.realm} in {season.word} of {year}, and the cold and the empty stores broke the host before it ever saw the enemy." }
  - { id: ca_sup4, when: [tag=supply_failed, att.general], t: "{att.general} could not feed the {att.host} of {att.realm} on the march to {def.realm} in {year}, and brought back a hungry, sullen army." }
  - { id: ca_sup5, when: [tag=supply_failed], t: "Forage failed and the roads gave out; the war {att.realm} meant to wage on {def.realm} in {year} never reached a battlefield." }
  - { id: ca_win1, when: [tag=winter_quarters], t: "{att.realm|cap} wintered its {att.host} in quarters in {year}, waiting on a spring that brought no battle with {def.realm}." }
  - { id: ca_gen1, w: 0.05, t: "In {year} {att.realm} set out against {def.realm}, and came home again with nothing done." }
  - { id: ca_gen2, w: 0.05, t: "The march of {year} against {def.realm} came to nothing, and {att.realm} said little about it afterward." }

# =====================================================================================================================
# Sieges
# =====================================================================================================================
event.Siege:
  - { id: sg_full, when: [battle], w: 4, cd: 0, t: "{#siege.intro} {#siege.course?} {#siege.end} {#siege.after?}" }
  - { id: sg_short, when: [battle], w: 2, cd: 0, t: "{#siege.intro} {#siege.end}" }
  - { id: sg_bare1, when: ["!battle", settlement, att.realm], t: "In {year} {att.realm} besieged {settlement}." }
  - { id: sg_bare2, when: ["!battle", settlement], t: "{settlement} was besieged in {year}." }
  - { id: sg_bare3, when: ["!battle"], w: 0.25, t: "A siege was laid in {year}." }

siege.intro:
  - { id: si01, when: [settlement], t: "In {year} {att.realm} laid siege to {settlement}." }
  - { id: si02, when: [settlement, att.general], t: "{att.general} drew lines around {settlement} in {year} and settled down to starve it." }
  - { id: si03, when: [settlement, season=winter], w: 2, t: "In {season.word} of {year} the {att.host} of {att.realm} closed around {settlement}." }
  - { id: si04, when: [settlement, season=summer], w: 2, t: "In {season.word} of {year} {att.realm} dug in before the walls of {settlement}." }
  - { id: si05, when: [settlement], t: "After the field was won, {att.realm} turned on {settlement} in {year} and invested it." }
  - { id: si06, when: [settlement], t: "{def.realm|cap} fell back behind the walls of {settlement} in {year}, and {att.realm} followed." }
  - { id: si07, when: [settlement, settlement.kind], t: "The {settlement.kind} of {settlement} shut its gates against {att.realm} in {year}." }
  - { id: si08, when: [settlement, span], t: "In {year} began the siege of {settlement}, which was to last {span}." }
  - { id: si09, when: [settlement, def.people], t: "In {year} the {def.people} of {settlement} watched the camp-fires of {att.realm} ring their walls." }
  - { id: si10, when: [settlement, season=autumn], w: 2, t: "When the leaves fell in {year}, {att.realm} was encamped around {settlement}." }
  - { id: si11, when: [settlement, season=spring], w: 2, t: "In {season.word} of {year} {att.realm} brought its {att.host} to the walls of {settlement}." }

siege.course:
  - { id: sc_fever1, when: [beat=camp_fever], w: 3, t: "Fever broke out in the siege camp, and the besiegers began to bury more than the besieged." }
  - { id: sc_fever2, when: [beat=camp_fever], w: 3, t: "The siege lines rotted with sickness; every morning the {att.adj} carts carried out the dead." }
  - { id: sc_wcamp1, when: [beat=winter_camp], w: 3, t: "Winter came down on the siege camp, and the besiegers shivered harder than the besieged." }
  - { id: sc_wcamp2, when: [beat=winter_camp], w: 3, t: "Snow filled the trenches, and the {att.host} huddled in its tents and cursed the walls." }
  - { id: sc_starve1, when: [beat=starved_out], w: 3, t: "Inside, the stores ran low, then lower; the people of {settlement} ate their horses, then their dogs." }
  - { id: sc_starve2, when: [beat=starved_out], w: 3, t: "Hunger walked the streets of {settlement}, and nobody could keep it out." }
  - { id: sc_breach1, when: [beat=walls_breached], w: 3, t: "The engines battered the walls of {settlement} until a breach yawned wide enough for a column." }
  - { id: sc_esc1, when: [beat=escalade], w: 3, t: "Night after night the besiegers came at the walls with ladders." }
  - { id: sc_held1, when: [beat=held_out], w: 3, t: "{settlement} held out, month after month, long past the point anyone outside had expected." }
  - { id: sc_span1, when: [span], t: "The siege dragged on for {span}." }
  - { id: sc_span2, when: [span, months], t: "For {span} nothing went in or out of {settlement} but arrows." }
  - { id: sc_span3, when: [span], t: "It was {span} of mud, hunger and waiting." }

siege.end:
  # stormed
  - { id: se_st1, when: [end=stormed], t: "In the end {att.realm} stormed the walls, and {settlement} fell in a night of fire." }
  - { id: se_st2, when: [end=stormed, beat=escalade], w: 2, t: "At last the ladders went up all at once, and by dawn the {att.adj} banner flew over {settlement}." }
  - { id: se_st3, when: [end=stormed, beat=walls_breached], w: 2, t: "The breach was carried at the third assault, and the {att.host} poured into {settlement}." }
  - { id: se_st4, when: [end=stormed, att.general], t: "{att.general} led the final assault {att.general.him}self, and {settlement} was taken by the sword." }
  - { id: se_st5, when: [end=stormed], t: "{settlement} was taken by storm, and what followed is not written down." }
  # surrendered
  - { id: se_su1, when: [end=surrendered], t: "Starving, {settlement} opened its gates to {att.realm}." }
  - { id: se_su2, when: [end=surrendered], t: "The garrison of {settlement} surrendered on terms, and marched out thin as ghosts." }
  - { id: se_su3, when: [end=surrendered, def.realm], t: "With no help coming from {def.realm}, {settlement} gave itself up." }
  - { id: se_su4, when: [end=surrendered], t: "When the last of the grain was gone, the elders of {settlement} carried the keys out to the {att.adj} camp." }
  - { id: se_su5, when: [end=surrendered, beat=starved_out], w: 2, t: "{settlement} was starved into submission, and surrendered." }
  # betrayed
  - { id: se_be1, when: [end=betrayed], t: "{settlement} did not fall to the enemy: it was sold. A gate was left unbarred one night, and {att.realm} walked in." }
  - { id: se_be2, when: [end=betrayed], t: "Treachery ended it: someone inside opened a postern to {att.realm}, and was paid in silver." }
  - { id: se_be3, when: [end=betrayed, beat=gate_opened], w: 2, t: "A traitor opened the gate of {settlement} in the small hours, and the {att.host} was inside before the alarm was raised." }
  - { id: se_be4, when: [end=betrayed], t: "{settlement} was betrayed from within, and the name of the traitor is still a curse among the {def.people}." }
  # relieved
  - { id: se_re1, when: [end=relieved], t: "Then a relief army appeared on the skyline, and {att.realm} broke camp and ran." }
  - { id: se_re2, when: [end=relieved], t: "{def.realm|cap} sent a host to the relief of {settlement}, and the siege was broken." }
  - { id: se_re3, when: [end=relieved, beat=relief_arrived], w: 2, t: "Help came at the last hour: banners on the road, and the besiegers caught between the walls and the relief." }
  - { id: se_re4, when: [end=relieved], t: "{settlement} was relieved, and its people wept on the walls to see the banners of {def.realm}." }
  # lifted
  - { id: se_li1, when: [end=lifted], t: "In the end {att.realm} gave it up, lifted the siege, and marched away." }
  - { id: se_li2, when: [end=lifted], t: "{settlement} outlasted its besiegers: {att.realm} struck its tents and went home." }
  - { id: se_li3, when: [end=lifted, beat=camp_fever], w: 2, t: "Sickness did what the defenders could not, and {att.realm} lifted the siege." }
  - { id: se_li4, when: [end=lifted, beat=winter_camp], w: 2, t: "Winter finished the siege: {att.realm} could not hold its lines through the snow, and withdrew." }
  - { id: se_li5, when: [end=lifted], t: "The siege was lifted, and {settlement} rang its bells for a week." }
  # abandoned
  - { id: se_ab1, when: [end=abandoned], t: "The besiegers simply melted away, their supplies spent, and {settlement} found itself alone." }
  - { id: se_ab2, when: [end=abandoned], t: "{att.realm|cap} abandoned the siege of {settlement}, its host too hungry and too few to go on." }
  - { id: se_ab3, when: [end=abandoned, beat=held_out], w: 2, t: "{settlement} held out until there was nobody left outside to hold out against." }
  - { id: se_x1, when: [winner=attacker, settlement], w: 0.5, t: "{settlement} fell to {att.realm}." }
  - { id: se_x2, when: [winner=defender, settlement], w: 0.5, t: "{settlement} held against {att.realm}." }
  - { id: se_x3, w: 0.2, t: "So the siege ended." }

siege.after:
  - { id: sa_st1, when: [end=stormed], t: "The town was given over to the sack." }
  - { id: sa_st2, when: [end=stormed], t: "The {def.people} of {settlement} would remember the sack for three generations." }
  - { id: sa_su1, when: [end=surrendered|betrayed], t: "{settlement} passed into the hands of {att.realm}." }
  - { id: sa_su2, when: [end=surrendered|betrayed, att.general], t: "{att.general} rode through the gate of {settlement} and took its keys." }
  - { id: sa_li1, when: [end=lifted|abandoned|relieved], t: "{att.realm|cap} went home with nothing but a grudge." }
  - { id: sa_li2, when: [end=lifted|abandoned|relieved], t: "The walls of {settlement} were the stronger for it, in the minds of its people at least." }
  - { id: sa_x1, when: [att.loss], t: "{att.realm|cap} came out of the siege lines with {att.loss}, by the reckoning of its own clerks." }

# =====================================================================================================================
# Realms: founding, conquest, rebellion, collapse, absorption
# =====================================================================================================================
event.Founding:
  - { id: fo01, t: "In {year} the {people} raised {realm} and named its first hearth." }
  - { id: fo02, when: [place], t: "{realm|cap} was founded in {year}, with its seat at {place}." }
  - { id: fo03, t: "In {year} the {adj} clans swore themselves into one people, and called it {realm}." }
  - { id: fo04, when: [form=Kingdom], w: 2, t: "{realm|cap} began in {year} as a kingdom, with a crown and a hall and a quarrel over both." }
  - { id: fo05, when: [form=MerchantRepublic], w: 2, t: "In {year} the guilds and the great houses founded {realm}, a republic of ledgers and ships." }
  - { id: fo06, when: [form=LooseAssociation], w: 2, t: "In {year} the {adj} steadings bound themselves loosely together as {realm}, each keeping its own counsel." }
  - { id: fo07, when: [form=Horde], w: 2, t: "In {year} a war-banner was raised over the {adj} camps, and {realm} rode out for the first time." }
  - { id: fo08, when: [place], t: "{year}: the {people} cut the first stones at {place}, and {realm} was born." }
  - { id: fo09, t: "The {people} first gathered under the name of {realm} in {year}, or so their singers claim." }
  - { id: fo10, when: [place, form=Kingdom], w: 2, t: "In {year} a hall was built at {place} and a crown set on a head, and that was the beginning of {realm}." }

event.Conquest:
  - { id: cq01, when: [other.realm], t: "In {year} {realm} bent {other.realm} to its will, and the {other.people} learned the customs of their conquerors." }
  - { id: cq02, when: [other.realm], t: "{other.realm|cap} fell under the rule of {realm} in {year}; its old ways were not forbidden, only forgotten." }
  - { id: cq03, when: [other.realm], t: "In {year} {realm} conquered {other.realm}, and {adj} governors took the halls of the {other.adj} lords." }
  - { id: cq04, when: [other.realm], t: "The {other.people} of {other.realm} became subjects of {realm} in {year}, and their children spoke the conquerors' tongue." }
  - { id: cq05, when: [other.realm], t: "{year} saw the end of {other.realm} as a free people: {realm} was master now." }
  - { id: cq06, when: [other.realm], t: "In {year} {realm} raised its banners over the seat of {other.realm}, and the {other.adj} court knelt." }
  - { id: cq07, when: [other.realm], t: "After the rout of {year}, {other.realm} had no choice: it took the yoke of {realm}." }
  - { id: cq08, when: [other.realm], t: "The conquest of {other.realm} by {realm} was complete in {year}; {adj} law ran where {other.adj} law had run." }
  - { id: cq09, w: 0.05, t: "In {year} {realm} conquered a neighbour." }

event.Rebellion:
  - { id: rb01, when: [other.realm], t: "In {year} the far provinces of {other.realm} rose in revolt and declared themselves {realm}." }
  - { id: rb02, when: [other.realm], t: "{realm|cap} broke away from {other.realm} in {year}, tired of taxes paid to a distant hall." }
  - { id: rb03, when: [other.realm, place], t: "In {year} {place} threw off the rule of {other.realm} and became the seat of a new realm, {realm}." }
  - { id: rb04, when: [other.realm], t: "The rebels of {year} would not be called subjects of {other.realm} any more; they called themselves {realm}." }
  - { id: rb05, when: [other.realm], t: "Oppressed and far from the capital, the people of the marches rose against {other.realm} in {year}, and {realm} was born in the rising." }
  - { id: rb06, when: [other.realm], t: "In {year} the border lords of {other.realm} tore up their oaths and swore new ones, to {realm}." }
  - { id: rb07, when: [other.realm], t: "{year}: rebellion in {other.realm}. When the smoke cleared there were two realms, and the new one was {realm}." }
  - { id: rb08, w: 0.05, t: "In {year} {realm} rose in rebellion and won its freedom." }

event.PolityCollapsed:
  - { id: pc01, when: [successors], t: "In {year} {realm} fell apart, and from its pieces rose {successors}." }
  - { id: pc02, when: [successors], t: "{realm|cap} could not hold together; in {year} it broke into {successors}." }
  - { id: pc03, when: [successors], t: "{realm|cap} died in {year}, and its heirs were {successors}." }
  - { id: pc04, when: [successors], t: "{year}: the collapse of {realm}. Its governors became kings, and their kingdoms were {successors}." }
  - { id: pc05, when: [successors], t: "In {year} the bonds of {realm} snapped one by one, leaving {successors} to quarrel over the ruins." }
  - { id: pc06, when: [successors], t: "Nobody could say afterward who struck the first blow, but by the end of {year} {realm} was gone and {successors} stood in its place." }
  - { id: pc07, w: 0.05, t: "In {year} {realm} collapsed into warring fragments." }

event.PolityAbsorbed:
  - { id: pa01, when: [other.realm], t: "In {year} {realm} was absorbed into {other.realm}, its name kept only in old songs." }
  - { id: pa02, when: [other.realm], t: "{realm|cap} ceased to be in {year}: its people became the people of {other.realm}." }
  - { id: pa03, when: [other.realm], t: "In {year} the last lords of {realm} swore fealty to {other.realm}, and the old banner was rolled up for good." }
  - { id: pa04, when: [other.realm], t: "{other.realm|cap} swallowed {realm} in {year}, and hardly anyone noticed the difference." }
  - { id: pa05, when: [other.realm], t: "In {year} {realm} merged into {other.realm}; the marriage was not of equals." }
  - { id: pa06, when: [other.realm], t: "By {year} {realm} was a province of {other.realm} in all but name, and soon in name too." }
  - { id: pa07, w: 0.05, t: "In {year} {realm} was absorbed by a neighbour." }

# =====================================================================================================================
# Diplomacy: treaties, grudges, ultimatums, tribute
# =====================================================================================================================
event.Treaty:
  - { id: tr_m1, when: [treaty=marriage, other.realm], t: "In {year} {realm} and {other.realm} sealed a peace with a marriage, and the feast lasted nine days." }
  - { id: tr_m2, when: [treaty=marriage, other.realm], t: "A marriage joined the houses of {realm} and {other.realm} in {year}." }
  - { id: tr_m3, when: [treaty=marriage, other.realm], t: "In {year} an heir of {realm} was wed to an heir of {other.realm}, and the two realms called each other kin." }
  - { id: tr_m4, when: [treaty=marriage, other.realm], t: "The wedding of {year} bound {realm} to {other.realm}; whether the couple was happy, the chronicles do not say." }
  - { id: tr_m5, when: [treaty=marriage, other.realm], t: "Rings were exchanged in {year} between the houses of {realm} and {other.realm}, and swords were put away for a while." }
