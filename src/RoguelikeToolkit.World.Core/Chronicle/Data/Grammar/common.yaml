  - { id: ex02, when: [route.a, route.b], t: "In {year} the merchants of {route.a} and {route.b} were trading more than {noun.goods}: songs and words went too." }
  - { id: ex03, when: [route.a, route.b], t: "By {year} the market at {route.a} was full of loanwords from {route.b}." }
  - { id: ex04, when: [route.a, route.b], t: "The road from {route.a} to {route.b} carried {noun.goods}, and in {year} it carried new words as well." }
  - { id: ex05, when: [route.a, route.b], t: "In {year} the children of {route.b} were singing songs first heard in {route.a}." }
  - { id: ex06, when: [route.a, route.b], t: "Trade between {route.a} and {route.b} brought strange fashions in {year}, and the elders complained." }
  - { id: ex07, when: [route.a, route.b], t: "Caravans moved between {route.a} and {route.b} all through {year}, and each town came home a little changed." }
  - { id: ex08, w: 0.05, t: "In {year} trade carried new words along the roads." }

event.Smuggling:
