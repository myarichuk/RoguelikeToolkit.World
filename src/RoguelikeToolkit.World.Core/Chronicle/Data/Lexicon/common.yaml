# Chronicle lexicon: list key -> words. A slot names a list directly ({verb.won}) or a fact points at one (terrain.noun ->
# terrain.forest). A word is drawn at most once per event, and a word drawn lately is passed over while others remain.
# Culture overlays (Lexicon/<culture>.yaml) add words to a list; "key!" replaces the list for that culture.
# Words may hold slots and symbols themselves ({realm}, {#symbol}).

# --- Seasons: read after "in" ("in the dead of winter").
season.spring: ["the thaw", "early spring", "the mud of spring", "the first green of the year", "the lambing season", "the spring rains"]
season.summer: ["high summer", "the long days", "the campaigning season", "the heat of summer", "midsummer", "the dry months"]
season.autumn: ["the harvest season", "autumn", "the falling of the leaves", "the last warm weeks", "the reaping month", "the grey of autumn"]
season.winter: ["the dead of winter", "the frost months", "deep winter", "the long dark of the year", "midwinter", "the season of snows"]

# --- Battlefields: read after "the" ("on the rolling fields").
