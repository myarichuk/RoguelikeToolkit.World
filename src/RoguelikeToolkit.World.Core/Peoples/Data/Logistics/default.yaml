Key: default
# The logistics network (HistoryFeatures.Logistics). Costs are road-degrees: one degree of a safe, open road costs 1.
# Settlements are the nodes; links are roads (the route between two capitals), rivers, sea lanes and open country.
RoadCost: 1.0
RoadUnsafe: 1.0          # a road costs x (1 + RoadUnsafe x (1 - safety))
SeveredCost: 2.5         # a severed road
WaystationRelief: 0.1    # each waystation on a road takes this share off its cost
RiverDegrees: 8
RiverCost: 0.8
SeaDegrees: 20
SeaCost: 0.8
SeaFrom: 50              # Seafaring (Warfare/<culture>.yaml) from which a people sails its hosts and supply
SeaForms: [MerchantRepublic]
OverlandDegrees: 10
OverlandCost: 2.0
TerrainCost: { open: 1.0, forest: 1.5, hills: 1.6, mountain: 3.0, marsh: 2.2, desert: 1.8, snow: 2.2 }
ForeignCost: 1.3         # a link touching a third party's land
HostileCost: 3.0         # a link touching the land of a polity fought within WarTurns
WarTurns: 3
SourceCost: { Hamlet: 6, Village: 3, Town: 1, City: 0 }   # what a settlement costs as a source of supply
WaystationSource: 1.0

# War: reach on the network, and winter quarters.
ReachCost: 140
WinterQuartersBelow: 0.6
WinterQuartersLoss: 0.12

# Roads drift (Fortification/default.yaml SafetyDrift) toward
#   BaseSafety + ProjectionSafety x hold + forts + waystations - severed - belligerents - outlaws,
# where hold is the mean over the route's two keepers of FormProjection x max(0, 1 - cost/ProjectionCost) at its middle.
BaseSafety: 0.4
ProjectionSafety: 0.25
ProjectionCost: 30
FormProjection: { Kingdom: 1.0, MerchantRepublic: 0.9, LooseAssociation: 0.5, Horde: 0.4 }
WaystationSafety: 0.05
WaystationsCounted: 3
BelligerentSafety: 0.3
OutlawSafety: 0.25

# Waystations: depots on long, unsafe roads.
WaystationDegrees: 4
WaystationChance: 0.15
WaystationLength: 6
WaystationBelow: 0.6
WaystationSpacing: 6
MaxWaystations: 2
WaystationClearance: 2
WaystationOffices: [chancellor, treasurer, elder, seer]
